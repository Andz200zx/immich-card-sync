name: release universal Mac app
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - name: build universal download
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/build.sh "${RELEASE_TAG#v}"
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already published; preserving its existing downloads."
          else
            gh release create "$RELEASE_TAG" dist/*.zip dist/*SHA256SUMS.txt --verify-tag --title "$RELEASE_TAG" --notes-file .github/release-notes.md
          fi
